# SATRE §8 — compose opcional (nginx, php-fpm, mysql, python, worker).
# Python y MySQL solo en red interna. Nginx es el único puerto público.
# Copiar `.env.example` → `.env` y rellenar secretos antes de `docker compose up -d`.

name: satre

x-laravel-env: &laravel-env
  APP_NAME: "${APP_NAME:-SATRE COAR Junín}"
  APP_ENV: ${APP_ENV:-local}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY}
  APP_URL: ${APP_URL:-https://localhost}
  APP_LOCALE: es
  APP_FAKER_LOCALE: es_PE
  BCRYPT_ROUNDS: "12"
  LOG_CHANNEL: stack
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: ${MYSQL_DATABASE:-satre_coar}
  DB_USERNAME: ${MYSQL_USER:-satre_app}
  DB_PASSWORD: ${MYSQL_PASSWORD}
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  CACHE_STORE: database
  FILESYSTEM_DISK: local
  FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost}
  SANCTUM_EXPIRATION: "480"
  PYTHON_ANALYTICS_URL: http://python:8001
  PYTHON_ANALYTICS_KEY: ${INTERNAL_KEY}
  PYTHON_ANALYTICS_TIMEOUT: "8"
  TZ: America/Lima

x-php: &php-service
  build:
    context: .
    dockerfile: deploy/php/Dockerfile
  volumes:
    - ./satre-backend:/var/www/backend
  environment:
    <<: *laravel-env
  depends_on:
    mysql:
      condition: service_healthy
  networks:
    - internal
  restart: unless-stopped

services:
  nginx:
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://localhost/api}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs
      - ./satre-backend/public:/var/www/backend/public:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - public
      - internal
    restart: unless-stopped

  php-fpm:
    <<: *php-service
    command: ["php-fpm", "-F"]
    environment:
      <<: *laravel-env
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000)?0:1);'"]
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    <<: *php-service
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90", "--backoff=5"]
    environment:
      <<: *laravel-env
      AUTO_MIGRATE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      php-fpm:
        condition: service_healthy
    healthcheck:
      disable: true

  scheduler:
    <<: *php-service
    command: ["php", "artisan", "schedule:work"]
    environment:
      <<: *laravel-env
      AUTO_MIGRATE: "false"
    depends_on:
      mysql:
        condition: service_healthy
      php-fpm:
        condition: service_healthy
    healthcheck:
      disable: true

  python:
    build:
      context: ./satre-analytics
      dockerfile: Dockerfile
    environment:
      INTERNAL_KEY: ${X_INTERNAL_KEY:-${INTERNAL_KEY}}
      X_INTERNAL_KEY: ${X_INTERNAL_KEY:-${INTERNAL_KEY}}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL_NAME: ${AI_MODEL_NAME:-gemini-2.5-flash}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-8}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${MYSQL_DATABASE:-satre_coar}
      DB_USERNAME: satre_ro
      DB_PASSWORD: ${SATRE_RO_PASSWORD}
      MAX_BODY_BYTES: "65536"
      TZ: America/Lima
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8001/health',headers={'X-Internal-Key':os.environ['INTERNAL_KEY']}); urllib.request.urlopen(r,timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-satre_coar}
      MYSQL_USER: ${MYSQL_USER:-satre_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SATRE_RO_PASSWORD: ${SATRE_RO_PASSWORD}
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  public:
  internal:

volumes:
  mysql_data:
  nginx_certs:

# SATRE §8 — Supervisor: uvicorn (solo 127.0.0.1; Laravel es el único cliente)
# Instalar: cp deploy/supervisor/satre-uvicorn.conf /etc/supervisor/conf.d/ && supervisorctl update
# Requiere venv en /var/www/satre-analytics/.venv y .env con INTERNAL_KEY (≥32).

[program:satre-uvicorn]
command=/var/www/satre-analytics/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001 --workers 2 --no-access-log
directory=/var/www/satre-analytics
user=www-data
autostart=true
autorestart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/satre-uvicorn.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
environment=TZ="America/Lima"

# SATRE §8 — Supervisor: php artisan queue:work
# Instalar: cp deploy/supervisor/satre-queue.conf /etc/supervisor/conf.d/ && supervisorctl update

[program:satre-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/satre-backend/artisan queue:work --sleep=1 --tries=3 --timeout=90 --backoff=5 --max-time=3600
directory=/var/www/satre-backend
user=www-data
numprocs=1
autostart=true
autorestart=true
stopwaitsecs=70
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/satre-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=7
environment=TZ="America/Lima"

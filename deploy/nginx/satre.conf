# SATRE §8 — Nginx en VPS (Ubuntu LTS).
# Copiar snippets a /etc/nginx/snippets/ y este archivo a /etc/nginx/sites-available/satre
# Sustituir satre.example.edu.pe por el FQDN y emitir certificado: certbot --nginx -d FQDN
# Python (uvicorn) NO se publica: solo 127.0.0.1:8001 detrás de Laravel.

upstream satre_php {
    server unix:/run/php/php8.2-fpm.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name satre.example.edu.pe;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name satre.example.edu.pe;
    server_tokens off;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/satre.example.edu.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/satre.example.edu.pe/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;
    ssl_stapling on;
    ssl_stapling_verify on;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/coar-alerta-frontend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass satre_php;
        fastcgi_param SCRIPT_FILENAME /var/www/satre-backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/satre-backend/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass satre_php;
        fastcgi_param SCRIPT_FILENAME /var/www/satre-backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/satre-backend/public;
        fastcgi_param HTTPS on;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location ^~ /sanctum {
        include fastcgi_params;
        fastcgi_pass satre_php;
        fastcgi_param SCRIPT_FILENAME /var/www/satre-backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/satre-backend/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        include /etc/nginx/snippets/security-headers-api.conf;
    }

    location /storage/ {
        alias /var/www/satre-backend/public/storage/;
        include /etc/nginx/snippets/security-headers.conf;
    }
}

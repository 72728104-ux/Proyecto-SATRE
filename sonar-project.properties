# ============================================================================
# SATRE COAR Junín — Configuración de análisis para SonarQube / SonarCloud
# ----------------------------------------------------------------------------
# Ejecutar SIEMPRE desde la raíz del monorepo:
#   C:\Proyecto
#
# El proyecto es multi-lenguaje (PHP/Laravel, JavaScript/React y Python/FastAPI)
# y se analiza como UN SOLO proyecto de Sonar para conservar una visión
# integrada de la calidad. Los reportes de cobertura deben generarse antes
# de ejecutar el scanner.
# ============================================================================

# URL del servidor SonarQube local (descomenta sonar.organization solo para SonarCloud)
sonar.host.url=http://localhost:9000

sonar.projectKey=uc-group4612142_satre
sonar.projectName=SATRE
sonar.sources=.
sonar.host.url=http://localhost:9000
sonar.token=sqp_a7ec807a29c54ecd60427f703abd297bbe3b5f70
sonar.exclusions=**/node_modules/**,**/satre-analytics/.venv/**,**/dist/**,**/build/**

# En SonarCloud es obligatorio indicar la organización. En un SonarQube local
# esta propiedad se ignora o debe ir comentada.
# sonar.organization=uc-group4612142

# ----------------------------------------------------------------------------
# Código fuente analizado (tres stacks + infraestructura)
# ----------------------------------------------------------------------------
sonar.sources=satre-backend/app,satre-backend/bootstrap/app.php,satre-backend/config,satre-backend/database,satre-backend/routes,satre-backend/resources/views,coar-alerta-frontend/src,satre-analytics/app,deploy,.github

# ----------------------------------------------------------------------------
# Pruebas
# Los tests del frontend están colocados junto al código (*.test.jsx); por eso
# se analizan como fuente y se excluyen del cálculo de cobertura más abajo.
# ----------------------------------------------------------------------------
sonar.tests=satre-backend/tests,satre-analytics/tests
sonar.test.inclusions=satre-backend/tests/**/*.php,satre-analytics/tests/**/*.py

# ----------------------------------------------------------------------------
# Exclusiones: dependencias, artefactos generados, cachés y reportes.
# NO se excluye código de negocio para "mejorar" el indicador.
# ----------------------------------------------------------------------------
sonar.exclusions=**/vendor/**,**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/.pytest_cache/**,**/storage/**,**/bootstrap/cache/**,**/public/build/**,**/*.min.js,**/*.map,**/package-lock.json,**/composer.lock,**/*.sqlite,**/data/**,**/coverage.xml,**/.coverage,**/.scannerwork/**

# ----------------------------------------------------------------------------
# Cobertura (los tres reportes se generan antes del scanner)
# ----------------------------------------------------------------------------
sonar.php.coverage.reportPaths=satre-backend/coverage.xml
sonar.javascript.lcov.reportPaths=coar-alerta-frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=satre-analytics/coverage.xml

# Exclusiones de cobertura: solo código de arranque/configuración, migraciones
# y los propios archivos de test. La lógica de negocio (Services, Controllers,
# Policies, componentes y módulos Python) NO se excluye.
sonar.coverage.exclusions=**/*.test.js,**/*.test.jsx,satre-backend/bootstrap/**,satre-backend/config/**,satre-backend/database/**,satre-backend/routes/**,coar-alerta-frontend/src/main.jsx

# ----------------------------------------------------------------------------
# Duplicación: se deja sin exclusiones para no ocultar copia/pega real.
# Si en el futuro se excluye código generado, documentar el motivo aquí.
# ----------------------------------------------------------------------------
# sonar.cpd.exclusions=

# ----------------------------------------------------------------------------
# Solo para CI: esperar el Quality Gate y fallar el job si no se cumple.
# No se recomienda en la ejecución local porque bloquea la terminal.
# ----------------------------------------------------------------------------
# sonar.qualitygate.wait=true
sonar.exclusions=**/node_modules/**,**/satre-analytics/.venv/**,**/dist/**,**/build/**,**/*.test.js,**/*.test.jsx,**/tests/**

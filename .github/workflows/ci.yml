name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: pint + php artisan test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satre-backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none
      - name: Composer
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test

  analytics:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satre-analytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: satre-analytics/requirements.txt
      - name: Dependencies
        run: pip install -r requirements.txt pytest
      - name: Pytest
        run: pytest

  frontend:
    name: lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coar-alerta-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coar-alerta-frontend/package-lock.json
      - name: Dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: https://localhost/api
        run: npm run build

name: CI

on:
  push:
    branches: [main, master, staging]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: pint + php artisan test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satre-backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none
      - name: Composer
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Pint
        run: vendor/bin/pint --test
      - name: Tests
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan test

  analytics:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: satre-analytics
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: satre-analytics/requirements.txt
      - name: Dependencies
        run: pip install --only-binary=:all: -r requirements.txt
      - name: Pytest
        run: pytest

  frontend:
    name: lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coar-alerta-frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: coar-alerta-frontend/package-lock.json
      - name: Dependencies
        run: npm ci --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_URL: https://localhost/api
        run: npm run build
